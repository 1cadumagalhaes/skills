apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: analytics
  labels: {app: api-gateway, owner: data-platform}
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway, owner: data-platform}
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: worker
          image: us-docker.pkg.dev/demo-platform/analytics/api-gateway:2026-11-20
          args: ["uvicorn", "worker_api:app", "--host", "0.0.0.0", "--port", "8080"]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            failureThreshold: 3
